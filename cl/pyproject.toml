[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "careloop"
version = "0.2.0"
description = "Voice-first medicine care: MCP server, Nemotron prescription reading on Nebius Token Factory, and a live caregiver dashboard"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "mcp<2",
  "openai",
  "python-multipart",
  "tzdata",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff"]

[tool.setuptools]
packages = ["careloop"]

[tool.setuptools.package-data]
careloop = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "UP"]
ignore = ["E501", "B008"]